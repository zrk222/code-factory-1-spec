name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: install HSF so the handoff round-trip test runs instead of skipping
        run: pip install "code-factory-3-compile @ git+https://github.com/zrk222/code-factory-3-compile@main"
      - run: pytest -q
      - name: end-to-end walkthrough (every README quickstart step on the example)
        run: bash examples/refund-portal/walkthrough.sh wt
